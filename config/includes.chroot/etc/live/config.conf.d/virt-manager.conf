# Extend live-user groups so virt-manager can use local QEMU/KVM without root.
# Setting LIVE_USER_DEFAULT_GROUPS replaces live-config defaults — keep them.
# Defaults from live-config(7): audio cdrom dip floppy video plugdev netdev
# powerdev scanner bluetooth; plus sudo (installer parity) and libvirt kvm.
LIVE_USER_DEFAULT_GROUPS="audio cdrom dip floppy video plugdev netdev powerdev scanner bluetooth sudo libvirt kvm"
