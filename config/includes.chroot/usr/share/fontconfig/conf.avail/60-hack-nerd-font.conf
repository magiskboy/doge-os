<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer Hack Nerd Font as system defaults</description>

  <!-- UI / proportional text -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Hack Nerd Font Propo</family>
    </prefer>
  </alias>
  <alias>
    <family>Hack Nerd Font Propo</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>

  <!-- Terminals / editors / monospace apps -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Hack Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>Hack Nerd Font Mono</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
</fontconfig>
